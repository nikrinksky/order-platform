spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/orderplatform
    username: platform
    password: dev123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: host.docker.internal:19092
    consumer:
      group-id: user-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
#        spring.json.type.mapping: com.orderplatform.user.dto.UserCreatedEvent
#        spring.json.type.mapping: "user.created.event:com.orderplatform.user.dto.UserCreatedEvent"

    producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: 8082

logging:
  level:
    com.orderplatform.user: DEBUG