spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5433/userdb
    username: userplatform
    password: dev123

  sql:
    init:
      mode: always
      continue-on-error: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        default_schema: user_profile

  kafka:
    enabled: false  # Отключено по умолчанию, включается через profiles (docker/dev)
    consumer:
      group-id: user-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082

logging:
  level:
    com.orderplatform.user: DEBUG

---
# Профиль для разработки (локальный запуск в IDEA)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/userdb
    username: userplatform
    password: dev123

  sql:
    init:
      mode: always
      continue-on-error: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_schema: user_profile

  security:
    debug: true

server:
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true
    include-stacktrace: on_param

logging:
  level:
    com.orderplatform.user: DEBUG
    org.springframework.web: DEBUG
    org.springframework.kafka: DEBUG

---
# Профиль для Docker
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://user-db:5432/userdb
    username: userplatform
    password: dev123
    hikari:
      connection-timeout: 30000
      validation-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1200000
      minimum-idle: 5
      maximum-pool-size: 10
      connection-test-query: SELECT 1
      auto-commit: true

  sql:
    init:
      mode: never
      continue-on-error: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: user_profile
        datasource:
          preinit: true

  kafka:
    enabled: true
    bootstrap-servers: redpanda:9092
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.orderplatform.user.dto,com.orderplatform.auth.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.value.default.to.string: true
        spring.json.add.type.headers: false
        compression.type: none
