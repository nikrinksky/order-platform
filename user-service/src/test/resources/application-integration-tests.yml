spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/orderplatform
    username: platform
    password: dev123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ""  # Пустое значение отключает Kafka
    consumer:
      group-id: user-service-test-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: 0  # Случайный порт для интеграционных тестов

logging:
  level:
    com.orderplatform.user: INFO
    org.springframework.test: INFO
