spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
      default_schema: user_profile
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: user_profile
  kafka:
    enabled: false
  sql:
    init:
      mode: never

server:
  port: 0

logging:
  level:
    com.orderplatform.user: INFO
    org.springframework.test: INFO

jwt:
  secret: test-secret-key-for-integration-tests-must-be-long-enough
  expiration: 3600000

  security:
    user:
      name: testuser
      password: testpass
