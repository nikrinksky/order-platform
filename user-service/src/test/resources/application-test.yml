spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderplatform
    username: platform
    password: dev123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: user_profile
  kafka:
    bootstrap-servers: localhost:9092
    enabled: false
  sql:
    init:
      mode: always
      continue-on-error: true
server:
  port: 8080

logging:
  level:
    com.orderplatform.user: INFO
    org.springframework.test: INFO
    org.springframework.jdbc: INFO
    org.postgresql: WARN