spring:
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5433/userdb}
    username: ${USER_DB_USERNAME:userplatform}
    password: ${USER_DB_PASSWORD:dev123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: user_profile
  kafka:
    enabled: true
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: user-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.orderplatform.user.dto"
  sql:
    init:
      mode: always
      continue-on-error: true
server:
  port: 8080

logging:
  level:
    com.orderplatform.user: INFO
    org.springframework.test: INFO
    org.springframework.jdbc: INFO
    org.postgresql: WARN