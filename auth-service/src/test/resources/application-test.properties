# Конфигурация тестовой базы данных — In-Memory Database H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Консоль H2 (необязательно, для отладки)
spring.h2.console.enabled=true

# Конфигурация JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Конфигурация Redis для тестов
spring.redis.host=127.0.0.1
spring.redis.port=6379

# Отключаем Kafka для тестов
spring.kafka.bootstrap-servers=localhost:9092

# JWT конфигурация для тестов
jwt.secret=testSecretKeyForIntegrationTests1234567890
jwt.expiration=3600000
jwt.refresh-expiration=604800000
