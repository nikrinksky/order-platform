spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderplatform
    username: platform
    password: dev123
    driver-class-name: org.postgresql.Driver

    # Инициализация схемы перед созданием таблиц (Spring Boot 3.x)
    sql:
      init:
        mode: always
        continue-on-error: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: auth

  data:
    redis:
      enabled: false

  kafka:
    enabled: true
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: auth-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

jwt:
  secret: testSecretKeyForIntegrationTests1234567890
  expiration: 3600000
  refresh-expiration: 604800000

logging:
  level:
    com.orderplatform.auth: INFO
    org.springframework.security: WARN
    org.springframework.test: INFO
    org.springframework.jdbc: INFO
    org.postgresql: WARN
