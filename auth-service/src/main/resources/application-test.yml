spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

    # Инициализация схемы перед созданием таблиц (Spring Boot 3.x)
    sql:
      init:
        mode: always
        continue-on-error: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: auth

  data:
    redis:
      enabled: false

  kafka:
    enabled: false

jwt:
  secret: testSecretKeyForIntegrationTests1234567890
  expiration: 3600000
  refresh-expiration: 604800000

logging:
  level:
    com.orderplatform.auth: DEBUG
    org.springframework.security: DEBUG
    org.springframework.test: DEBUG

---
# H2 Console and driver for tests
spring:
  h2:
    console:
      enabled: false
