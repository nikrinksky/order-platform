spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderplatform
    username: platform
    password: dev123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: dev123
      timeout: 2000ms

  kafka:
    enabled: false

jwt:
  secret: testSecretKeyForIntegrationTests1234567890
  expiration: 3600000
  refresh-expiration: 604800000

logging:
  level:
    com.orderplatform.auth: DEBUG
    org.springframework.security: DEBUG
    org.springframework.test: DEBUG