spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/orderplatform
    username: ${DB_USER:platform}
    password: ${DB_PASSWORD:dev123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dev123}
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: auth-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration: 604800000

server:
  port: 8090
  error:
    include-message: never
    include-binding-errors: never
    include-exception: false
    include-stacktrace: never

logging:
  level:
    com.orderplatform.auth: INFO
    org.springframework.security: WARN
    org.springframework.data.redis: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    displayRequestDuration: true
    filter: true
    disable-swagger-default-url: true
    oauth2RedirectUrl: http://localhost:8090/swagger-ui/oauth2-redirect.html
    csrf:
      enabled: false

---
# Профиль для разработки (локальный запуск в IDEA)
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  security:
    debug: true

jwt:
  secret: devSecretKeyForLocalDevelopmentOnlyDoNotUseInProduction1234567890

server:
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true
    include-stacktrace: on_param

logging:
  level:
    com.orderplatform.auth: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.redis: DEBUG
    io.lettuce.core: DEBUG
    org.springdoc: DEBUG

management:
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true
    tryItOutEnabled: true

---
# Профиль для Docker
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/orderplatform
    username: platform
    password: dev123

  data:
    redis:
      host: redis
      port: 6379
      password: dev123

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  kafka:
    enabled: false

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

logging:
  level:
    com.orderplatform.auth: DEBUG
    org.springframework.security: DEBUG
    org.springdoc: DEBUG

management:
  health:
    redis:
      enabled: true
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tryItOutEnabled: true

server:
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true