spring:
  # The datasource is a PostgreSQL Testcontainer, contributed by AbstractIntegrationTest: the
  # connection details do not exist until the container is up, so they cannot live in this file.
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      enabled: false
  kafka:
    enabled: false
    bootstrap-servers: localhost:9999

jwt:
  secret: testSecretKeyForIntegrationTests1234567890
  expiration: 3600000
  refresh-expiration: 604800000

logging:
  level:
    com.orderplatform.auth: INFO
    org.springframework.security: WARN
