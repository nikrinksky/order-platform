spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      enabled: false
  kafka:
    enabled: false
    bootstrap-servers: localhost:9999

jwt:
  secret: testSecretKeyForIntegrationTests1234567890
  expiration: 3600000
  refresh-expiration: 604800000

logging:
  level:
    com.orderplatform.auth: INFO
    org.springframework.security: WARN
