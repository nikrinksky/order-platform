services:
  # ============= INFRASTRUCTURE =============
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: orderplatform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: dev123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - order-network

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: dev123
      MONGO_INITDB_DATABASE: orderplatform
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - order-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass dev123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - order-network


  # ============= KAFKA (REDPANDA) =============
  redpanda:
    image: redpandadata/redpanda:v23.3.1
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp 1
      - --memory 1G
      - --overprovisioned
    ports:
      - "19092:19092"
      - "9092:9092"
#      - "9644:9644"  # Redpanda Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - order-network
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============= SCHEMA REGISTRY =============
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://redpanda:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - order-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

#  # ============= REDPANDA CONSOLE (UI) =============
#  redpanda-console:
#    image: redpandadata/console:v2.4.6
#    ports:
#      - "8089:8080"
#    environment:
#      KAFKA_BROKERS: redpanda:9092
#      CONNECT_ENABLED: "false"
#      SCHEMAREGISTRY_ENABLED: "true"
#      SCHEMAREGISTRY_URLS: http://schema-registry:8081
#    depends_on:
#      redpanda:
#        condition: service_healthy
#      schema-registry:
#        condition: service_healthy
#    networks:
#      - order-network
#    restart: unless-stopped

  # ============= MICROSERVICES =============
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderplatform
      SPRING_DATASOURCE_USERNAME: platform
      SPRING_DATASOURCE_PASSWORD: dev123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: dev123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - order-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped



  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://auth-service:8090
    networks:
      - order-network
    depends_on:
      - auth-service

    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderplatform
      SPRING_DATASOURCE_USERNAME: platform
      SPRING_DATASOURCE_PASSWORD: dev123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - order-network
    restart: unless-stopped

  # ============= DEVELOPMENT TOOLS =============
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - dev
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@orderplatform.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - order-network
    depends_on:
      - postgres
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    profiles:
      - dev
    ports:
      - "8087:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: dev123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - order-network
    depends_on:
      - mongodb
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles:
      - dev
    ports:
      - "8088:8081"
    environment:
      REDIS_HOSTS: default:redis:6379:0:dev123
    networks:
      - order-network
    depends_on:
      - redis
    restart: unless-stopped

networks:
  order-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  redpanda_data: