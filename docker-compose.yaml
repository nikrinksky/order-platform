services:
  # ============= INFRASTRUCTURE =============
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: orderplatform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: dev123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - order-network

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: dev123
      MONGO_INITDB_DATABASE: orderplatform
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - order-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass dev123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - order-network

  # ============= MICROSERVICES =============
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderplatform
      SPRING_DATASOURCE_USERNAME: platform
      SPRING_DATASOURCE_PASSWORD: dev123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: dev123
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
    restart: unless-stopped
    networks:
      - order-network
    depends_on:
      - postgres
      - redis

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://auth-service:8090
    networks:
      - order-network
    depends_on:
      - auth-service

  # ============= DEVELOPMENT TOOLS =============
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - dev
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@orderplatform.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - order-network
    depends_on:
      - postgres
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    profiles:
      - dev
    ports:
      - "8087:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: dev123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks:
      - order-network
    depends_on:
      - mongodb
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles:
      - dev
    ports:
      - "8088:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
      REDIS_PASSWORD: dev123
    networks:
      - order-network
    depends_on:
      - redis
    restart: unless-stopped

networks:
  order-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data: