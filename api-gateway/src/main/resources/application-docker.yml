spring:
  grpc:
    client:
      channels:
        product:
          address: ${PRODUCT_GRPC_ADDRESS:static://product-service:9096}
          default-deadline: 3s
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:dev123}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO