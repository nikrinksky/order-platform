spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://host.docker.internal:8090}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: auth-service-health
          uri: ${AUTH_SERVICE_URL:http://host.docker.internal:8090}
          predicates:
            - Path=/health, /info, /actuator/**
          filters:
            - StripPrefix=0
    compatibility-verifier:
      enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
