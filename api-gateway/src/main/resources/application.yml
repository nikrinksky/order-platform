spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=0

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=0

            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=0

            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=0

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=0

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=0

            # Health and info of the auth service, kept for the smoke checks that look at the
            # gateway. /actuator/** is deliberately not listed: it used to be proxied here, so a
            # scrape of the gateway's own /actuator/prometheus returned the auth service metrics.
            - id: auth-service-health
              uri: ${AUTH_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/health, /info
              filters:
                - StripPrefix=0

            # One route per service so the aggregated Swagger UI can fetch every document through
            # the gateway. Each one rewrites the public path to the document path the service
            # actually serves, which is /api-docs in auth-service and the springdoc default
            # /v3/api-docs everywhere else.
            - id: api-docs-auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api-docs/auth
              filters:
                - SetPath=/api-docs

            - id: api-docs-user
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api-docs/user
              filters:
                - SetPath=/v3/api-docs

            - id: api-docs-product
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api-docs/product
              filters:
                - SetPath=/v3/api-docs

            - id: api-docs-inventory
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api-docs/inventory
              filters:
                - SetPath=/v3/api-docs

            - id: api-docs-order
              uri: ${ORDER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api-docs/order
              filters:
                - SetPath=/v3/api-docs

            - id: api-docs-notification
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api-docs/notification
              filters:
                - SetPath=/v3/api-docs
      compatibility-verifier:
        enabled: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:dev123}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hmac-sha}

gateway:
  # Addresses of the proxies whose X-Forwarded-For is believed, comma-separated. Empty means none:
  # the gateway port is published directly, so a header from an arbitrary peer is just a value the
  # client chose, and trusting it would let one client hand itself a fresh rate-limit bucket on
  # every request. Fill this in when the gateway runs behind a known proxy or load balancer.
  trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}

# The Swagger UI is served by the gateway itself and lists every service's document, so one page
# covers the whole platform. The documents are fetched through the routes above.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
    urls:
      - name: auth
        url: /api-docs/auth
      - name: user
        url: /api-docs/user
      - name: product
        url: /api-docs/product
      - name: inventory
        url: /api-docs/inventory
      - name: order
        url: /api-docs/order
      - name: notification
        url: /api-docs/notification

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Traces are shipped over OTLP. A local run exports to a Jaeger started by hand; compose points
  # OTEL_EXPORTER_OTLP_ENDPOINT at the jaeger container.
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
