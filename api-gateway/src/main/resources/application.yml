spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/auth/**

        - id: auth-health
          uri: http://localhost:8090
          predicates:
            - Path=/health, /info, /actuator/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG