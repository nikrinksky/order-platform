# Datasources provisioned into Grafana on startup, so a fresh container already has both stores.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      # The dashboard links to the raw PromQL of every panel, which helps while learning the stack
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000

  # Traces. Grafana reads them through the Jaeger datasource, so a trace id from a log line can be
  # opened next to the metrics and logs of the same request.
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
