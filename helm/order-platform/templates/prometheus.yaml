{{/*
Prometheus: scrapes the seven services and evaluates the alert rules. The scrape configuration is
the same file the compose stack mounts - the targets are Service names, and inside one namespace
those resolve to the pods.
*/}}
{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    {{- .Files.Get "files/prometheus.yml" | nindent 4 }}
  alert-rules.yml: |
    {{- .Files.Get "files/alert-rules.yml" | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.monitoring.prometheus.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.monitoring.prometheus.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "prometheus") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "order-platform.selectorLabels" (dict "context" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "order-platform.labels" . | nindent 8 }}
        {{- include "order-platform.selectorLabels" (dict "context" . "component" "prometheus") | nindent 8 }}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "prometheus") | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "prometheus") | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: {{ .Values.monitoring.prometheus.service.nodePort }}
{{- end }}
