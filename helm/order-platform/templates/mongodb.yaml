{{/*
MongoDB: the catalogue of product-service and the notification log. One instance, two databases
with their own users, seeded by the init script on the first start only.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
data:
  init-mongo-init.js: |
    {{- .Files.Get "files/init-mongo-init.js" | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.mongodb.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.mongodb.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "mongodb") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "order-platform.selectorLabels" (dict "context" . "component" "mongodb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "order-platform.labels" . | nindent 8 }}
        {{- include "order-platform.selectorLabels" (dict "context" . "component" "mongodb") | nindent 8 }}
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ .Values.mongodb.rootUsername | quote }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: {{ .Values.mongodb.rootPassword | quote }}
            - name: MONGO_INITDB_DATABASE
              value: productdb
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 15
            # mongosh is a Node.js process and needs longer than the 1 s default, otherwise the
            # probe kills a healthy server and the pod restarts in a loop
            timeoutSeconds: 15
            failureThreshold: 4
          livenessProbe:
            # A TCP check on purpose: an exec probe runs mongosh, which starts a Node.js runtime
            # and regularly exceeded the timeout on a loaded node, so a healthy server was
            # restarted. Liveness only has to notice a dead process, readiness does the real work.
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
        - name: init
          configMap:
            name: mongodb-init
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "mongodb") | nindent 4 }}
spec:
  selector:
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "mongodb") | nindent 4 }}
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
