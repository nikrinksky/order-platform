{{/*
Loki: the log store. The configuration is the compose one - every path already lives under /loki,
which is where the volume is mounted.
*/}}
{{- if .Values.monitoring.loki.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
data:
  loki-config.yaml: |
    {{- .Files.Get "files/loki-config.yaml" | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.monitoring.loki.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.monitoring.loki.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "loki") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "order-platform.selectorLabels" (dict "context" . "component" "loki") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "order-platform.labels" . | nindent 8 }}
        {{- include "order-platform.selectorLabels" (dict "context" . "component" "loki") | nindent 8 }}
    spec:
      containers:
        - name: loki
          image: {{ .Values.monitoring.loki.image }}
          args:
            - -config.file=/etc/loki/loki-config.yaml
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "loki") | nindent 4 }}
spec:
  selector:
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "loki") | nindent 4 }}
  ports:
    - name: http
      port: 3100
      targetPort: http
{{- end }}
