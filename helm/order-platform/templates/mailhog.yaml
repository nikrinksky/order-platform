{{/*
MailHog: the SMTP sink for notification-service. Its UI lists every message the platform sent, and
it is the only entry point besides the gateway that is published on the node port.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "mailhog") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "order-platform.selectorLabels" (dict "context" . "component" "mailhog") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "order-platform.labels" . | nindent 8 }}
        {{- include "order-platform.selectorLabels" (dict "context" . "component" "mailhog") | nindent 8 }}
    spec:
      containers:
        - name: mailhog
          image: {{ .Values.mailhog.image }}
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "order-platform.labels" . | nindent 4 }}
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "mailhog") | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "order-platform.selectorLabels" (dict "context" . "component" "mailhog") | nindent 4 }}
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
      nodePort: {{ .Values.mailhog.service.nodePort }}
