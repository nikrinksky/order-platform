spring:
  # The datasource is a PostgreSQL Testcontainer, contributed by AbstractInventoryIntegrationTest.
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  kafka:
    enabled: false
# The tests run without Redis, and the blacklist lookup would only add connection noise there.
security:
  token-blacklist:
    enabled: false
logging:
  level:
    com.orderplatform.inventory: INFO
    org.springframework.security: WARN
