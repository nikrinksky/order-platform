server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5434}/inventorydb
    username: ${SPRING_DATASOURCE_USERNAME:inventoryuser}
    password: ${SPRING_DATASOURCE_PASSWORD:dev123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
        auto.register.schemas: true

# Transactional outbox: reservation events are stored with the stock change
# and published by the relay, so a broker outage cannot lose them.
outbox:
  events:
    InventoryReservedEvent: com.orderplatform.events.inventory.InventoryReservedEvent
    InventoryReleasedEvent: com.orderplatform.events.inventory.InventoryReleasedEvent
  retry:
    max-attempts: 3
    initial-backoff-ms: 200
    max-backoff-ms: 2000
    multiplier: 2.0
    max-total-attempts: 10
  relay:
    batch-size: 100
    poll-interval-ms: 1000
    claim-timeout-ms: 60000
    send-timeout-ms: 10000

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hmac-sha}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://inventorydb:5432/inventorydb
    username: ${SPRING_DATASOURCE_USERNAME:inventoryuser}
    password: ${SPRING_DATASOURCE_PASSWORD:dev123}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
        auto.register.schemas: true

