spring:
  # The connection is a MongoDB Testcontainer, contributed by AbstractNotificationIntegrationTest.
  kafka:
    enabled: false
  security:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
# The tests run without Redis, and the blacklist lookup would only add connection noise there.
security:
  token-blacklist:
    enabled: false
logging:
  level:
    com.orderplatform.notification: INFO
