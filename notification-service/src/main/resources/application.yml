server:
  port: 8085

spring:
  data:
    mongodb:
      host: ${SPRING_DATA_MONGODB_HOST:localhost}
      port: ${SPRING_DATA_MONGODB_PORT:27017}
      database: ${SPRING_DATA_MONGODB_DATABASE:notificationdb}
      username: ${SPRING_DATA_MONGODB_USERNAME:notificationuser}
      password: ${SPRING_DATA_MONGODB_PASSWORD:dev123}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.orderplatform.notification.dto"
        spring.json.add.type.headers: false
        spring.json.use.type.headers: false

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hmac-sha}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      host: ${SPRING_DATA_MONGODB_HOST:notificationdb}
      port: 27017
      database: ${SPRING_DATA_MONGODB_DATABASE:notificationdb}
      username: ${SPRING_DATA_MONGODB_USERNAME:notificationuser}
      password: ${SPRING_DATA_MONGODB_PASSWORD:dev123}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.orderplatform.notification.dto"
        spring.json.add.type.headers: false
        spring.json.use.type.headers: false
