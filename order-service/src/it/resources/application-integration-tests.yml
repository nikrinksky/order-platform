spring:
  # The datasource is a PostgreSQL Testcontainer, contributed by AbstractOrderIntegrationTest.
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        default_schema: public
  kafka:
    enabled: false
# The tests run without Redis, and the blacklist lookup would only add connection noise there.
security:
  token-blacklist:
    enabled: false
logging:
  level:
    com.orderplatform.order: INFO
    org.springframework.security: WARN
