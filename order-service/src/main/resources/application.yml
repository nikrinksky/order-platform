server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5435}/orderdb
    username: ${SPRING_DATASOURCE_USERNAME:orderuser}
    password: ${SPRING_DATASOURCE_PASSWORD:dev123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: orders
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
        auto.register.schemas: true
    consumer:
      group-id: order-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        retry.backoff-ms: 1000
        retry.max-attempts: 3

# Transactional outbox: events are stored with the order and published by the relay.
# The event mapping is explicit so an unknown event type fails at startup, not mid incident.
outbox:
  events:
    OrderCreatedEvent: com.orderplatform.events.order.OrderCreatedEvent
    OrderStatusChangedEvent: com.orderplatform.events.order.OrderStatusChangedEvent
  retry:
    max-attempts: 3
    initial-backoff-ms: 200
    max-backoff-ms: 2000
    multiplier: 2.0
    max-total-attempts: 10
  relay:
    batch-size: 100
    poll-interval-ms: 1000
    claim-timeout-ms: 60000
    send-timeout-ms: 10000

services:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://product-service:8089}
  inventory-service:
    url: ${INVENTORY_SERVICE_URL:http://inventory-service:8083}

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hmac-sha}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://orderdb:5432/orderdb
    username: ${SPRING_DATASOURCE_USERNAME:orderuser}
    password: ${SPRING_DATASOURCE_PASSWORD:dev123}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
        auto.register.schemas: true
    consumer:
      group-id: order-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        retry.backoff-ms: 1000
        retry.max-attempts: 3

services:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://product-service:8089}
  inventory-service:
    url: ${INVENTORY_SERVICE_URL:http://inventory-service:8083}
