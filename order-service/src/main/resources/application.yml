server:
  port: 8084

spring:
  # Also the service name in traces and metrics: without it spans land under "unknown_service".
  application:
    name: order-service
  # Stock operations go to inventory-service over gRPC. The address and the deadline live here,
  # not in code; "static://" tells the resolver the name is a plain host:port, not a DNS scheme.
  grpc:
    client:
      channels:
        inventory:
          address: ${INVENTORY_GRPC_ADDRESS:static://localhost:9095}
          # A hung stock call must fail the order instead of holding the request open.
          default-deadline: 5s
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5435}/orderdb
    username: ${SPRING_DATASOURCE_USERNAME:orderuser}
    password: ${SPRING_DATASOURCE_PASSWORD:dev123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: orders
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
        auto.register.schemas: true
    consumer:
      group-id: order-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        retry.backoff-ms: 1000
        retry.max-attempts: 3
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:dev123}

# Tokens revoked on logout or refresh are rejected here too, so logout is not only cosmetic on the
# service that issued the token. The lookup fails open: a Redis outage must not stop every
# authenticated request.
security:
  token-blacklist:
    enabled: true

# Transactional outbox: events are stored with the order and published by the relay.
# The event mapping is explicit so an unknown event type fails at startup, not mid incident.
outbox:
  events:
    OrderCreatedEvent: com.orderplatform.events.order.OrderCreatedEvent
    OrderStatusChangedEvent: com.orderplatform.events.order.OrderStatusChangedEvent
  retry:
    max-attempts: 3
    initial-backoff-ms: 200
    max-backoff-ms: 2000
    multiplier: 2.0
    max-total-attempts: 10
  relay:
    batch-size: 100
    poll-interval-ms: 1000
    claim-timeout-ms: 60000
    send-timeout-ms: 10000

services:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://product-service:8089}

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hmac-sha}

# API documentation. Served at /v3/api-docs and /swagger-ui.html; set SWAGGER_ENABLED=false where
# the documents must not be reachable. The gateway aggregates all of them into one Swagger UI.
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Traces are shipped over OTLP. A local run exports to a Jaeger started by hand; compose points
  # OTEL_EXPORTER_OTLP_ENDPOINT at the jaeger container.
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

---
spring:
  config:
    activate:
      on-profile: docker
  grpc:
    client:
      channels:
        inventory:
          address: ${INVENTORY_GRPC_ADDRESS:static://inventory-service:9095}
          default-deadline: 5s
  datasource:
    url: jdbc:postgresql://orderdb:5432/orderdb
    username: ${SPRING_DATASOURCE_USERNAME:orderuser}
    password: ${SPRING_DATASOURCE_PASSWORD:dev123}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        enable.idempotence: true
        auto.register.schemas: true
    consumer:
      group-id: order-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
        retry.backoff-ms: 1000
        retry.max-attempts: 3
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:dev123}

services:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://product-service:8089}
