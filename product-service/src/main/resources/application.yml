server:
  port: 8089

spring:
  # Also the service name in traces and metrics: without it spans land under "unknown_service".
  application:
    name: product-service
  # The gateway reads a product over gRPC on this port; the public REST API stays on 8089.
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9096}
  data:
    mongodb:
      host: ${SPRING_DATA_MONGODB_HOST:localhost}
      port: ${SPRING_DATA_MONGODB_PORT:27017}
      database: ${SPRING_DATA_MONGODB_DATABASE:productdb}
      username: ${SPRING_DATA_MONGODB_USERNAME:productuser}
      password: ${SPRING_DATA_MONGODB_PASSWORD:dev123}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:dev123}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        spring.json.use.type.headers: false

# Tokens revoked on logout or refresh are rejected here too, so logout is not only cosmetic on the
# service that issued the token. The lookup fails open: a Redis outage must not stop every
# authenticated request.
security:
  token-blacklist:
    enabled: true

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-hmac-sha}

# API documentation. Served at /v3/api-docs and /swagger-ui.html; set SWAGGER_ENABLED=false where
# the documents must not be reachable. The gateway aggregates all of them into one Swagger UI.
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Traces are shipped over OTLP. A local run exports to a Jaeger started by hand; compose points
  # OTEL_EXPORTER_OTLP_ENDPOINT at the jaeger container.
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      host: ${SPRING_DATA_MONGODB_HOST:mongodb}
      port: 27017
      database: ${SPRING_DATA_MONGODB_DATABASE:productdb}
      username: ${SPRING_DATA_MONGODB_USERNAME:productuser}
      password: ${SPRING_DATA_MONGODB_PASSWORD:dev123}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:dev123}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        spring.json.use.type.headers: false
  main:
    banner-mode: off
  jackson:
    serialization:
      write-dates-as-timestamps: true
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: TRACE
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE
