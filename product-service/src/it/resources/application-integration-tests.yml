spring:
  # The integration tests drive the HTTP API; the gRPC server has its own test and would only
  # bind port 9096 while the suite runs.
  grpc:
    server:
      enabled: false
  # The connection is a MongoDB Testcontainer, contributed by AbstractProductIntegrationTest.
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
# The tests run without Redis, and the blacklist lookup would only add connection noise there.
security:
  token-blacklist:
    enabled: false
logging:
  level:
    com.orderplatform.product: INFO
    org.springframework.security: WARN
