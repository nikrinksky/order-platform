# .github/workflows/ci.yml
name: CI Pipeline

on:
  pull_request:
    branches: [ master, dev ]
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: orderplatform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: dev123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d orderplatform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      userdb:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: userdb
          POSTGRES_USER: userplatform
          POSTGRES_PASSWORD: dev123
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U userplatform -d userdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: dev123
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/orderplatform
      SPRING_DATASOURCE_USERNAME: platform
      SPRING_DATASOURCE_PASSWORD: dev123
      USER_DB_URL: jdbc:postgresql://localhost:5433/userdb
      USER_DB_USERNAME: userplatform
      USER_DB_PASSWORD: dev123
      SPRING_REDIS_HOST: localhost
      SPRING_REDIS_PORT: '6379'
      SPRING_DATA_MONGODB_URI: mongodb://admin:dev123@localhost:27017/orderplatform

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Checkstyle
        run: mvn checkstyle:check -Dcheckstyle.config.location=./config/checkstyle/sun_checks.xml

      - name: Run Unit Tests (skip JaCoCo check for PRs)
        run: mvn test -DskipITs=true -Djacoco.skip=true

      - name: Run Integration Tests
        run: mvn verify -Pintegration-tests -Djacoco.skip=true

      - name: OWASP Dependency-Check (non-blocking report)
        continue-on-error: true
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=11 -DfailOnError=false -DsuppressionFile=${{ github.workspace }}/config/dependency-check-suppression.xml

      - name: Build JAR files
        run: mvn package -DskipTests

      - name: Build Docker Images
        run: |
          for service in api-gateway auth-service user-service product-service inventory-service order-service notification-service; do
            docker build -t order-platform/$service:pr-${{ github.event.number }} ./$service
          done

      - name: Security Scan (Trivy - api-gateway, non-blocking)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: order-platform/api-gateway:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - auth-service, non-blocking)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: order-platform/auth-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - user-service, non-blocking)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: order-platform/user-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - product-service, non-blocking)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: order-platform/product-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - inventory-service, non-blocking)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: order-platform/inventory-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - order-service, non-blocking)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: order-platform/order-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - notification-service, non-blocking)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: order-platform/notification-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/jacoco-report/