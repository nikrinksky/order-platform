# .github/workflows/ci.yml
name: CI Pipeline

on:
  pull_request:
    branches: [ master, dev ]
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: orderplatform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: dev123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: dev123
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Checkstyle
        run: mvn checkstyle:check

#      - name: Run Unit Tests with Coverage
#        run: mvn test jacoco:report

#      - name: Verify Coverage >= 80%
#        run: |
#          coverage=$(grep -oP '<counter type="INSTRUCTION" missed="\d+" covered="\d+">' target/site/jacoco/jacoco.xml | grep -oP 'covered="\K\d+' | awk '{sum+=$1} END {print sum}')
          # Сложная логика проверки, упростим:
#          mvn jacoco:check


      - name: Build JAR files
        run: mvn package -DskipTests

      - name: Build Docker Images
        run: |
          for service in api-gateway auth-service user-service product-service inventory-service order-service notification-service; do
            docker build -t order-platform/$service:pr-${{ github.event.number }} ./$service
          done

      - name: Run Integration Tests with Testcontainers
        run: mvn verify -Pintegration-tests

#      - name: Security Scan (Trivy)
#        run: |
#          for service in api-gateway auth-service user-service product-service inventory-service order-service notification-service; do
#            trivy image --severity CRITICAL order-platform/$service:pr-${{ github.event.number }}
#          done

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
#            **/target/jacoco-report/