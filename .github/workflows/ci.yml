# .github/workflows/ci.yml
name: CI Pipeline

on:
  pull_request:
    branches: [ master, dev ]
  push:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: orderplatform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: dev123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d orderplatform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      userdb:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: userdb
          POSTGRES_USER: userplatform
          POSTGRES_PASSWORD: dev123
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U userplatform -d userdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: dev123
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # No runtime connection settings here on purpose. The integration tests boot their own
    # embedded H2 / embedded Mongo, and an environment variable outranks
    # application-integration-tests.yml. Exporting SPRING_DATASOURCE_URL / SPRING_DATA_MONGODB_URI
    # at job level therefore leaked into the tests and broke them (product and notification failed
    # with Mongo 'Command delete requires authentication': the app client picked the external
    # credentials up while flapdoodle still started an embedded server that expected its own).
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache OWASP NVD database
        id: nvd-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/odc-nvd
          # Key includes plugin version: bump it when dependency-check-maven is upgraded
          # (old schema with VARCHAR(1000) URL column breaks newer plugin versions)
          key: ${{ runner.os }}-odc-nvd-12.1.0
          restore-keys: |
            ${{ runner.os }}-odc-nvd-

      - name: Run Checkstyle
        run: mvn checkstyle:check -Dcheckstyle.config.location=./config/checkstyle/sun_checks.xml

      # Retry wrapper: Maven Central occasionally returns HTTP 429 (rate limit)
      # on bursts of downloads; a short backoff resolves transient failures.
      - name: Run Unit Tests (skip JaCoCo check for PRs)
        run: |
          for i in 1 2 3; do
            mvn test -DskipITs=true -Djacoco.skip=true && break
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "::warning::mvn test failed (attempt $i), likely Maven Central 429 - retrying in 30s"
            sleep 30
          done

      - name: Run Integration Tests
        run: |
          for i in 1 2 3; do
            mvn verify -Pintegration-tests -Djacoco.skip=true && break
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "::warning::mvn verify failed (attempt $i), likely Maven Central 429 - retrying in 30s"
            sleep 30
          done

      - name: Install modules to local repo (for OWASP default-cli)
        run: |
          for i in 1 2 3; do
            mvn install -DskipTests -Djacoco.skip=true && break
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "::warning::mvn install failed (attempt $i), likely Maven Central 429 - retrying in 30s"
            sleep 30
          done

      # OWASP scan: blocking on push to master, non-blocking on PRs.
      # Rationale: NVD keeps publishing new CVEs against the EOL Spring 6.2.x /
      # Spring Cloud 4.3.x / Spring Security 6.5.x lines (no OSS fixes until a
      # Boot 4.x migration). New CVEs must not block PR iteration; the policy
      # stays enforced on master pushes.
      - name: OWASP Dependency-Check (blocking on push to master)
        if: github.event_name == 'push'
        timeout-minutes: 180
        env:
          # Optional: set NVD_API_KEY secret in GitHub to speed up NVD download
          # (without a key, full NVD sync can take 2+ hours)
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "NVD cache hit: ${{ steps.nvd-cache.outputs.cache-hit }}"
          mvn org.owasp:dependency-check-maven:check \
            -DdataDirectory=${{ runner.temp }}/odc-nvd \
            -DfailBuildOnCVSS=7 \
            -DfailOnError=false \
            -DsuppressionFile=${{ github.workspace }}/config/dependency-check-suppression.xml

      - name: OWASP Dependency-Check (non-blocking on PR)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 180
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "NVD cache hit: ${{ steps.nvd-cache.outputs.cache-hit }}"
          mvn org.owasp:dependency-check-maven:check \
            -DdataDirectory=${{ runner.temp }}/odc-nvd \
            -DfailBuildOnCVSS=7 \
            -DfailOnError=false \
            -DsuppressionFile=${{ github.workspace }}/config/dependency-check-suppression.xml

      - name: Build JAR files
        run: mvn package -DskipTests

      - name: Build Docker Images
        run: |
          for service in api-gateway auth-service user-service product-service inventory-service order-service notification-service; do
            docker build -t order-platform/$service:pr-${{ github.event.number }} ./$service
          done

      # Trivy image scan: blocking on push to master, non-blocking on PRs - the same policy
      # as the OWASP scan above, and for the same reason. The EOL Spring 6.2.x line keeps
      # collecting CVEs whose only fix is Spring Framework 7 (Boot 4.x). CVE-2026-47884
      # (CRITICAL, XsltView SSRF/RCE) is the current one: fixed in 7.0.9 only, while this
      # project uses no XSLT views at all. Findings still show up as warnings on every PR,
      # and master pushes stay gated.
      - name: Security Scan (Trivy - api-gateway)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: order-platform/api-gateway:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - auth-service)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: order-platform/auth-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - user-service)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: order-platform/user-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - product-service)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: order-platform/product-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - inventory-service)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: order-platform/inventory-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - order-service)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: order-platform/order-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Security Scan (Trivy - notification-service)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: order-platform/notification-service:pr-${{ github.event.number }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/jacoco-report/